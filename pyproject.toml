[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devrelay-x"
version = "0.1.0"
description = "AI software relay, governance, and evidence platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "httpx>=0.27,<1",
]

[project.scripts]
drx = "drx.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["drx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
